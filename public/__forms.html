<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>MF Travel enquiry registration</title></head>
<body>
<form name="enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="enquiry">
  <input name="subject" value="New MF Travel quote enquiry">
  <input name="bot-field">
  <input name="pickup"><input name="destination"><input name="date"><input name="time">
  <input name="passengers"><input name="name"><input name="contact"><input name="email" type="email">
  <input name="luggage"><textarea name="notes"></textarea>
</form>
</body></html>
